<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .card h2 {
            margin-top: 0;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- This div groups the h2 and p tags so they can be styled together as a "card" -->
    <div class="card">
        <h2>Card Title</h2>
        <p>This is some information inside a grouped division container.</p>
    </div>

</body>
</html>
