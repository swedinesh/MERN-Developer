<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jha*t aur Chatni | DOM</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
    <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerText = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    // addLanguage('C++');
    // addLanguage('Python');
    addLanguage('rust');
    addLanguage('TypeScript');

    function addOptiLanguage(langName){
        const li = document.createElement('li');
        // const addText = document.createTextNode(langName);
        // li.querySelector('.language').appendChild(li);

        li.appendChild(document.createTextNode(langName))

        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage('Dart')
    // Edit
   const secondLang = document.querySelector("li:nth-child(2)");

   console.log(secondLang)

   //optimize nhii hai ye
//    secondLang.innerHTML = 'Mojo'

const newli = document.createElement('li');

newli.textContent = "khojo";
secondLang.replaceWith(newli)

//edit - optimal

const firstLang = document.querySelector("li:first-child");

firstLang.outerHTML = '<li>C++</li>';

// remove

const lastLang = document.querySelector('li:last-child');

lastLang.remove();




</script>
</html>
